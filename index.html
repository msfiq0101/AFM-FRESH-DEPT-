<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFM Fresh Enterprise</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1119;color:#e5eaf0;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
#login{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.loginbox{width:100%;max-width:400px;background:#17222e;padding:30px;border:1px solid #304253;border-radius:16px}
.logo{font-size:24px;font-weight:bold;color:#65c995;margin-bottom:6px}
.loginbox p{color:#91a2b4;font-size:14px}
input{width:100%;padding:12px;margin:8px 0;background:#0d1721;border:1px solid #344454;border-radius:8px;color:white}
button.primary{width:100%;background:#23966b;border:0;color:white;padding:12px;border-radius:8px;font-weight:bold;margin-top:10px}
#app{display:none;min-height:100vh}
.sidebar{width:240px;background:#101c28;border-right:1px solid #283747;padding:20px;position:fixed;top:0;bottom:0;overflow:auto}
.logo2{font-weight:800;font-size:18px;color:#75d5a6;margin-bottom:5px}
.small{font-size:11px;color:#8293a4;margin-bottom:25px}
.navtitle{font-size:10px;color:#78899a;margin:20px 0 8px}
.nav{display:block;width:100%;padding:11px;border:0;border-radius:8px;background:none;color:#c2ced8;text-align:left;margin:3px 0}
.nav:hover,.nav.active{background:#243647;color:white}
.main{margin-left:240px;min-width:0}
.topbar{height:65px;border-bottom:1px solid #283747;display:flex;justify-content:space-between;align-items:center;padding:0 25px}
.content{padding:25px}
h1{font-size:24px;margin:0 0 8px}
.subtitle{color:#8293a4;font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#17222e;border:1px solid #304253;border-radius:12px;padding:18px}
.metric{font-size:12px;color:#93a4b5}
.value{font-size:26px;font-weight:bold;margin-top:10px}
.green{color:#63d39d}
.section{margin-top:20px}
.modulebtn{background:#17222e;border:1px solid #304253;color:#e5eaf0;padding:18px;border-radius:12px;text-align:left}
.modulebtn:hover{border-color:#55b58a}
.modulegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#workspace{margin-top:20px}
#msg{font-size:13px;margin-top:10px;color:#e7bd69}
.logout{background:#263747;border:1px solid #3b5064;color:white;border-radius:8px;padding:9px 14px}
@media(max-width:800px){
.sidebar{width:190px}
.main{margin-left:190px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.modulegrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:600px){
.sidebar{position:relative;width:100%;height:auto}
.main{margin-left:0}
#app{display:block}
.grid,.modulegrid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="login">
<div class="loginbox">
<div class="logo">AFM FRESH ENT</div>
<p>Fresh Department Enterprise System</p>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button class="primary" onclick="login()">LOGIN</button>
<div id="msg"></div>
</div>
</div>

<div id="app">
<aside class="sidebar">
<div class="logo2">AFM FRESH ENT</div>
<div class="small">ENTERPRISE MANAGEMENT</div>

<div class="navtitle">MAIN</div>
<button class="nav active" onclick="home()">Dashboard</button>

<div class="navtitle">OPERATIONS</div>
<div id="navs"></div>

<div class="navtitle">SYSTEM</div>
<button class="nav" onclick="showModule('System Audit')">System Audit</button>
<button class="nav" onclick="logout()">Logout</button>
</aside>

<main class="main">
<div class="topbar">
<div>AFM <span style="color:#63d39d">●</span> Enterprise</div>
<div id="user"></div>
</div>

<div class="content" id="content">
<h1>Dashboard</h1>
<div class="subtitle">Fresh Department Control Centre</div>

<div class="grid">
<div class="card"><div class="metric">Stock Items</div><div class="value">--</div></div>
<div class="card"><div class="metric">Receiving</div><div class="value">--</div></div>
<div class="card"><div class="metric">Tasks</div><div class="value">--</div></div>
<div class="card"><div class="metric">Alerts</div><div class="value green">--</div></div>
</div>

<div class="section card">
<h2>Enterprise Modules</h2>
<div class="subtitle">Select a module to open its workspace.</div>
<div id="modules" class="modulegrid"></div>
</div>

<div id="workspace"></div>
</div>
</main>
</div>

<script>
// ===========================================
// AFM SUPABASE CONFIGURATION
// ===========================================
const SUPABASE_URL = "PASTE_PROJECT_URL_HERE";
const SUPABASE_KEY = "NEXT_PUBLIC_SUPABASE_URL=https://avsdrxjblwkujrgvrbxa.supabase.co
NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_5T69FYmKbAL4z-pFt4q1AQ_us7WSpSi"

let token = "";
let currentUser = "";

const moduleList = [
"Fresh Operations",
"Stock Control",
"Stock Take",
"Receiving",
"Waste Management",
"Markdown Control",
"Temperature Logs",
"Equipment Register",
"Cleaning Records",
"Tasks & Assignment",
"SOP Library",
"SOP Checklist",
"Staff Training",
"Customer Complaints",
"Incident Reports",
"System Audit"
];

const nav=document.getElementById("navs");
const modules=document.getElementById("modules");

moduleList.forEach(m=>{
 let b=document.createElement("button");
 b.className="nav";
 b.textContent=m;
 b.onclick=()=>showModule(m);
 nav.appendChild(b);

 let c=document.createElement("button");
 c.className="modulebtn";
 c.innerHTML="<strong>"+m+"</strong><br><small style='color:#8293a4'>Open workspace →</small>";
 c.onclick=()=>showModule(m);
 modules.appendChild(c);
});

// ===========================================
// LOGIN
// ===========================================
async function login(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const msg=document.getElementById("msg");

 if(!email||!password){
  msg.textContent="Enter email and password.";
  return;
 }

 if(SUPABASE_URL.includes("PASTE")||SUPABASE_KEY.includes("PASTE")){
  msg.textContent="Supabase configuration has not been added yet.";
  return;
 }

 msg.textContent="Signing in...";

 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
   method:"POST",
   headers:{
    "apikey":SUPABASE_KEY,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({email,password})
  });

  const data=await r.json();

  if(!r.ok){
   msg.textContent=data.msg||data.message||data.error_description||"Login failed.";
   return;
  }

  token=data.access_token;
  currentUser=data.user.email||email;

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("user").textContent=currentUser;
  home();

 }catch(e){
  msg.textContent="Connection error. Check your configuration.";
 }
}

// ===========================================
// DASHBOARD
// ===========================================
function home(){
 document.getElementById("content").innerHTML=`
 <h1>Dashboard</h1>
 <div class="subtitle">Fresh Department Control Centre</div>
 <div class="grid">
  <div class="card"><div class="metric">Stock Items</div><div class="value">--</div></div>
  <div class="card"><div class="metric">Receiving</div><div class="value">--</div></div>
  <div class="card"><div class="metric">Tasks</div><div class="value">--</div></div>
  <div class="card"><div class="metric">Alerts</div><div class="value green">--</div></div>
 </div>
 <div class="section card">
  <h2>Enterprise Modules</h2>
  <div class="subtitle">Select a module to open its workspace.</div>
  <div id="modules" class="modulegrid"></div>
 </div>
 <div id="workspace"></div>
 `;
 const box=document.getElementById("modules");
 moduleList.forEach(m=>{
  const b=document.createElement("button");
  b.className="modulebtn";
  b.innerHTML="<strong>"+m+"</strong><br><small style='color:#8293a4'>Open workspace →</small>";
  b.onclick=()=>showModule(m);
  box.appendChild(b);
 });
}

// ===========================================
// MODULE WORKSPACES
// ===========================================
function showModule(name){
 document.getElementById("content").innerHTML=`
 <div style="color:#8293a4;font-size:12px;margin-bottom:15px">AFM / ${name}</div>
 <h1>${name}</h1>
 <div class="subtitle">Enterprise workspace</div>
 <div class="card">
  <h3>${name}</h3>
  <p style="color:#93a4b5">
  Workspace ready for module configuration.
  Database permissions and module workflow setup are the next stage.
  </p>
  <div id="workspaceStatus" style="color:#63d39d;font-size:13px">
  AFM system workspace
  </div>
 </div>
 <button class="primary" style="max-width:200px" onclick="home()">← Dashboard</button>
 `;
}

// ===========================================
// LOGOUT
// ===========================================
function logout(){
 token="";
 currentUser="";
 document.getElementById("app").style.display="none";
 document.getElementById("login").style.display="flex";
 document.getElementById("password").value="";
 document.getElementById("msg").textContent="";
}
</script>
</body>
</html>
